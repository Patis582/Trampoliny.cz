name: Sanity Dataset Backup

on:
  schedule:
    # Spustí se každou neděli o půlnoci (00:00 UTC)
    - cron: '0 0 * * 0'
  # Umožní spustit zálohu i ručně kliknutím v GitHub rozhraní
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # 1. Stžení kódu (volitelné, ale užitečné pro kontext)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Exportování datasetu ze Sanity přes HTTP API
      - name: Export Sanity Dataset
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.SANITY_AUTH_TOKEN }}" \
            "https://${{ secrets.SANITY_PROJECT_ID }}.api.sanity.io/v2021-06-07/data/export/production" \
            --output backup.tar.gz

      # 5. Uložení zálohy jako GitHub Artifact
      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanity-backup-${{ github.run_id }}
          path: backup.tar.gz
          # Jak dlouho má GitHub zálohu držet (ve dnech). Max je 90 pro free účty.
          retention-days: 90
